<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple Hello World page." />
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #172033;
        background: linear-gradient(135deg, #eef5ff 0%, #f9f5ff 100%);
      }

      main {
        width: min(100%, 38rem);
        padding: clamp(2rem, 7vw, 4rem);
        text-align: center;
        background: rgb(255 255 255 / 88%);
        border: 1px solid rgb(255 255 255 / 70%);
        border-radius: 1.5rem;
        box-shadow: 0 1.25rem 3.75rem rgb(53 75 121 / 14%);
      }

      .sparkle { font-size: 2.75rem; }

      h1 {
        margin: 1rem 0 0.75rem;
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        letter-spacing: -0.06em;
      }

      p {
        max-width: 28rem;
        margin: 0 auto;
        font-size: 1.1rem;
        line-height: 1.65;
        color: #536078;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="sparkle" aria-hidden="true">&#128075;</div>
      <h1>Hello, World!</h1>
      <p>A small, welcoming beginning for your next great idea.</p>
    </main>
  </body>
</html>
